<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Personal Expense Tracker</h1>

    <div class="total">
        <h2>Total Expenses</h2>
        <h1>₹ {{ "%.2f"|format(total) }}</h1>
    </div>

    <h2>Add New Expense</h2>

    <form action="/add" method="POST">

        <input type="text"
        name="title"
        placeholder="Expense Name"
        required>

        <input type="text"
        name="category"
        placeholder="Category"
        required>

        <input type="number"
        name="amount"
        placeholder="Amount"
        min="0.01"
        step="0.01"
        required>

        <button type="submit">Add Expense</button>

    </form>

    <h2>Expense History</h2>

    <table>

        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>

        {% for item in expenses %}

        <tr>
            <td>{{ item.title }}</td>
            <td>{{ item.category }}</td>
            <td>₹ {{ item.amount }}</td>

            <td>
                <a href="/delete/{{ loop.index0 }}">Delete</a>
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
